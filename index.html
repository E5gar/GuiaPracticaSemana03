<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Universidad Nacional del Centro del Perú - FIS" />
    <meta
      name="description"
      content="Catálogo de productos marca Huawei. Encontrarás smartphones, tablets, laptops, wearables y audio. Tecnología de HarmonyOS con carga rápida SuperCharge."
    />
    <meta
      name="keywords"
      content="Huawei, Mate, MatePad, MateBook, FreeBuds, Watch GT, HarmonyOS, tecnología, smartphones"
    />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#CF0A2C" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Tienda Online Huawei" />
    <meta property="og:description" content="Tienda de dispositivos marca Huawei" />
    <meta property="og:image" content="ABCD" />
    <meta property="og:locale" content="es_PE" />
    <link rel="canonical" href="ABCD" />
    <link rel="icon" href="ABCD" />
    <title>Tienda Online Huawei</title>
  </head>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous"
  />
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    rel="stylesheet"
  />
  <script src="https://cdn.tailwindcss.com"></script>
  <body class="bg-white text-slate-800">
    <div class="bg-slate-900 text-slate-300 py-2 text-sm">
      <div class="container d-flex flex-wrap justify-content-between align-items-center gap-2">
        <span class="d-flex align-items-center gap-2">
          <i class="bi bi-truck text-red-500"></i>
          Envío gratis a todo Perú en compras mayores a S/ 799
        </span>
        <span class="d-none d-md-flex align-items-center gap-3">
          <a href="#soporte" class="text-slate-300 text-decoration-none hover:text-white"
            >Soporte</a
          >
          <a href="#tiendas" class="text-slate-300 text-decoration-none hover:text-white"
            >Tiendas</a
          >
          <a href="#cuenta" class="text-slate-300 text-decoration-none hover:text-white"
            >Huawei ID</a
          >
        </span>
      </div>
    </div>
    <header class="sticky-top">
      <nav
        class="navbar navbar-expand-lg navbar-light bg-white shadow-md border-b border-slate-200 py-3"
      >
        <div class="container">
          <a class="navbar-brand d-flex align-items-center gap-2" href="#inicio">
            <img src="ABCD" alt="ABCD" width="40" height="40" class="rounded-md" />
            <span class="fw-bold tracking-tight text-slate-900">HUAWEI</span>
          </a>

          <button
            class="navbar-toggler border-0"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#menuPrincipal"
            aria-controls="menuPrincipal"
            aria-expanded="false"
            aria-label="Abrir menú de navegación"
          >
            <span class="navbar-toggler-icon"></span>
          </button>

          <div class="collapse navbar-collapse" id="menuPrincipal">
            <ul class="navbar-nav mx-auto mb-2 mb-lg-0 gap-lg-1">
              <li class="nav-item">
                <a
                  class="nav-link active px-3 rounded-lg hover:bg-slate-100"
                  aria-current="page"
                  href="#inicio"
                  >Inicio</a
                >
              </li>
              <li class="nav-item dropdown">
                <a
                  class="nav-link dropdown-toggle px-3 rounded-lg hover:bg-slate-100"
                  href="#productos"
                  role="button"
                  data-bs-toggle="dropdown"
                  aria-expanded="false"
                  >Productos</a
                >
                <ul class="dropdown-menu shadow-lg border-0 rounded-xl p-2">
                  <li>
                    <a class="dropdown-item rounded-lg py-2" href="#productos">Smartphones</a>
                  </li>
                  <li><a class="dropdown-item rounded-lg py-2" href="#productos">Tablets</a></li>
                  <li><a class="dropdown-item rounded-lg py-2" href="#productos">Laptops</a></li>
                  <li><hr class="dropdown-divider" /></li>
                  <li>
                    <a class="dropdown-item rounded-lg py-2" href="#productos">Wearables y audio</a>
                  </li>
                </ul>
              </li>
              <li class="nav-item">
                <a class="nav-link px-3 rounded-lg hover:bg-slate-100" href="#ecosistema"
                  >Ecosistema</a
                >
              </li>
              <li class="nav-item">
                <a class="nav-link px-3 rounded-lg hover:bg-slate-100" href="#soporte">Soporte</a>
              </li>
              <li class="nav-item">
                <a
                  class="nav-link px-3 rounded-lg hover:bg-slate-100 d-flex align-items-center gap-2"
                  href="#contacto"
                >
                  Empresas
                  <span class="badge rounded-pill bg-red-600 text-white">Nuevo</span>
                </a>
              </li>
            </ul>

            <div
              class="d-flex flex-column flex-lg-row gap-2 align-items-stretch align-items-lg-center"
            >
              <label for="buscador" class="visually-hidden">Buscar productos</label>
              <input
                id="buscador"
                type="search"
                class="form-control rounded-lg border-slate-300 bg-slate-50"
                placeholder="Buscar producto"
                aria-label="Buscar productos Huawei"
              />
              <a
                href="#contacto"
                class="btn text-white bg-red-600 hover:bg-red-700 rounded-lg px-4 fw-semibold"
                >Cotizar</a
              >
            </div>
          </div>
        </div>
      </nav>
    </header>
  </body>
</html>
